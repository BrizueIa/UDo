name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-tauri:
    name: Build & Publish (${{ matrix.platform }})
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build & Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'UDo v__VERSION__'
          releaseBody: |
            ## UDo v__VERSION__

            Official release of **UDo** (The way u do) — the opinionated, local-first notes and project organizer.

            ### What's New
            - 📄 **Universal WYSIWYG Flat Sheet**: Inline rich formatting with zero raw markdown markup.
            - 🖼️ **Dynamic Free-Media Flow**: Move images, 3D models (`.glb`/`.gltf`), voice notes, and file attachments directly on the sheet.
            - 🔒 **Private Vault**: AES-256-GCM encrypted notes protected by master password and quick toggle (`Ctrl + L`).
            - 📑 **Dual Note Split-View**: Side-by-side editing for multi-document workflows.
            - 📂 **Multi-Select & Native Context Menus**: Drag-and-drop hierarchy, batch operations, and trash recovery.
            - 🛡️ **100% Local-First & Zero Telemetry**: Your data stays on your machine.

            ### Downloads
            - **Linux**: `.AppImage` (portable) and `.deb` (Debian / Ubuntu / Pop!_OS)
            - **Windows**: `.exe` (NSIS installer) and `.msi`
            - **macOS**: Universal `.dmg` (Apple Silicon M-Series & Intel)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
